<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ARCADE DUEL - Connessione</title>
  <link rel="stylesheet" href="offline.css">
</head>
<body>
  <main>
    <h1>ARCADE <span>DUEL</span></h1>
    <div class="spinner" role="status" aria-label="Caricamento"></div>
    <p id="status" aria-live="polite">
      Connessione al server di gioco in corso. Il risveglio di Render puo richiedere oltre 50 secondi.
    </p>
    <button id="retry" type="button">RIPROVA ORA</button>
  </main>
  <script src="offline.js"></script>
</body>
</html>
